<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0A0F">
<title>Report Fit</title>
<link rel="apple-touch-icon" href="icon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<style>
  :root {
    /* ── Core palette ── */
    --bg:          #0A0A0F;
    --bg2:         #13131A;
    --bg3:         #1C1C26;
    --surface:     rgba(255,255,255,0.06);
    --surface2:    rgba(255,255,255,0.10);
    --border:      rgba(255,255,255,0.09);
    --border2:     rgba(255,255,255,0.15);

    /* ── Accent ── */
    --accent:      #00C896;
    --accent-dim:  rgba(0,200,150,0.15);
    --accent-glow: rgba(0,200,150,0.35);
    --amber:       #FF9F0A;
    --amber-dim:   rgba(255,159,10,0.15);
    --coral:       #FF6B6B;
    --coral-dim:   rgba(255,107,107,0.15);
    --blue:        #5AC8FA;
    --blue-dim:    rgba(90,200,250,0.15);

    /* ── Text ── */
    --t1:  rgba(255,255,255,0.95);
    --t2:  rgba(255,255,255,0.65);
    --t3:  rgba(255,255,255,0.38);
    --t4:  rgba(255,255,255,0.22);

    /* ── Spacing ── */
    --r-sm:  10px;
    --r-md:  16px;
    --r-lg:  22px;
    --r-xl:  28px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top:    env(safe-area-inset-top, 0px);
    --tab-h:       80px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--bg);
    color: var(--t1);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    height: 100%;
    overflow: hidden;
  }

  #root {
    height: 100%;
    overflow: hidden;
  }

  /* ── Scrollable screens ── */
  .screen {
    height: 100vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding-top: var(--safe-top);
  }

  /* ── Glass card ── */
  .glass {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  .glass-strong {
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: var(--r-lg);
    backdrop-filter: blur(32px);
    -webkit-backdrop-filter: blur(32px);
  }

  /* ── Tap feedback ── */
  .tappable { cursor: pointer; transition: transform 0.12s ease, opacity 0.12s ease; }
  .tappable:active { transform: scale(0.97); opacity: 0.85; }

  /* ── Tab bar ── */
  .tab-bar {
    position: fixed;
    bottom: 0;
    left: 0; right: 0;
    height: calc(var(--tab-h) + var(--safe-bottom));
    padding-bottom: var(--safe-bottom);
    background: rgba(10,10,15,0.92);
    border-top: 1px solid var(--border);
    backdrop-filter: blur(32px);
    -webkit-backdrop-filter: blur(32px);
    display: flex;
    align-items: flex-start;
    padding-top: 10px;
    z-index: 100;
  }

  .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    transition: opacity 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  .tab-icon {
    width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    transition: transform 0.2s cubic-bezier(.34,1.56,.64,1);
  }

  .tab-item.active .tab-icon { transform: scale(1.15); }
  .tab-label { font-size: 10px; font-weight: 600; letter-spacing: 0.2px; }

  /* ── Input ── */
  .rf-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    color: var(--t1);
    font-family: inherit;
    font-size: 16px;
    padding: 14px 16px;
    outline: none;
    transition: border-color 0.18s;
    -webkit-appearance: none;
    appearance: none;
  }
  .rf-input:focus { border-color: var(--accent); }
  .rf-input::placeholder { color: var(--t3); }

  /* ── Number hero input ── */
  .peso-input {
    background: transparent;
    border: none;
    color: var(--t1);
    font-family: inherit;
    font-size: 64px;
    font-weight: 700;
    letter-spacing: -2px;
    text-align: center;
    width: 180px;
    outline: none;
    -webkit-appearance: none;
  }
  .peso-input::placeholder { color: var(--t4); }

  /* ── Button ── */
  .rf-btn {
    width: 100%;
    padding: 16px;
    border-radius: var(--r-lg);
    border: none;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.2px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .rf-btn:active { transform: scale(0.97); }
  .rf-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .rf-btn-primary {
    background: var(--accent);
    color: #000;
  }
  .rf-btn-secondary {
    background: var(--surface);
    color: var(--t1);
    border: 1px solid var(--border);
  }
  .rf-btn-danger {
    background: var(--coral-dim);
    color: var(--coral);
    border: 1px solid rgba(255,107,107,0.25);
  }

  /* ── Segmented control ── */
  .seg-control {
    display: flex;
    background: var(--bg3);
    border-radius: var(--r-md);
    padding: 3px;
    gap: 2px;
  }
  .seg-item {
    flex: 1; padding: 9px 4px;
    border-radius: calc(var(--r-md) - 3px);
    border: none; background: transparent;
    font-family: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 0.18s;
    color: var(--t2);
  }
  .seg-item.active {
    background: var(--surface2);
    color: var(--t1);
    box-shadow: 0 1px 6px rgba(0,0,0,0.4);
  }

  /* ── Calendar strip ── */
  .cal-strip {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 4px 2px 8px;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .cal-strip::-webkit-scrollbar { display: none; }

  .cal-day {
    flex-shrink: 0;
    width: 42px;
    border-radius: 14px;
    padding: 8px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: all 0.15s;
    background: var(--surface);
  }
  .cal-day.today { border-color: var(--accent); }
  .cal-day.has-data { background: var(--accent-dim); }
  .cal-day.future { opacity: 0.3; cursor: default; }
  .cal-day .day-num { font-size: 16px; font-weight: 700; }
  .cal-day .day-wd { font-size: 9px; font-weight: 600; color: var(--t3); text-transform: uppercase; letter-spacing: 0.5px; }
  .cal-day .day-dot { width: 5px; height: 5px; border-radius: 50%; }

  /* ── Bottom sheet ── */
  .sheet-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    z-index: 200;
    display: flex; align-items: flex-end;
    animation: fade-in 0.2s ease;
  }
  .sheet-content {
    width: 100%;
    background: var(--bg2);
    border-radius: var(--r-xl) var(--r-xl) 0 0;
    border-top: 1px solid var(--border2);
    padding: 12px 20px calc(24px + var(--safe-bottom));
    max-height: 92vh;
    overflow-y: auto;
    animation: slide-up 0.32s cubic-bezier(.32,1,.36,1);
  }
  .sheet-handle {
    width: 36px; height: 4px;
    background: var(--t4);
    border-radius: 2px;
    margin: 0 auto 20px;
  }

  @keyframes slide-up {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }
  @keyframes fade-in {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* ── Pill / tag ── */
  .rf-pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px; font-weight: 700;
  }

  /* ── Section label ── */
  .sec-label {
    font-size: 11px; font-weight: 700;
    color: var(--t3);
    letter-spacing: 0.8px;
    text-transform: uppercase;
    padding: 0 2px;
    margin-bottom: 8px;
    margin-top: 4px;
  }

  /* ── Metric card ── */
  .metric-card {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 12px 14px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .metric-label { font-size: 10px; font-weight: 700; color: var(--t3); text-transform: uppercase; letter-spacing: 0.6px; }
  .metric-value { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
  .metric-unit  { font-size: 11px; color: var(--t3); font-weight: 500; }

  /* ── Toast ── */
  .toast {
    position: fixed; bottom: calc(var(--tab-h) + var(--safe-bottom) + 12px);
    left: 16px; right: 16px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: var(--r-md);
    padding: 14px 16px;
    font-size: 14px; font-weight: 600;
    color: var(--t1);
    backdrop-filter: blur(20px);
    z-index: 300;
    animation: toast-in 0.25s ease, toast-out 0.25s ease 2.5s forwards;
    display: flex; align-items: center; gap: 10px;
  }
  @keyframes toast-in  { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  @keyframes toast-out { from { opacity:1; } to { opacity:0; } }

  /* ── Feci scale ── */
  .feci-btn {
    width: 40px; height: 40px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--t2);
    font-size: 15px; font-weight: 800;
    cursor: pointer; transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .feci-btn.sel {
    border-color: var(--accent);
    background: var(--accent-dim);
    color: var(--accent);
  }

  /* ── Scrollable page content ── */
  .page-content {
    padding: 0 16px calc(calc(var(--tab-h) + var(--safe-bottom)) + 24px);
  }
</style>
</head>

<script type="text/babel">

const { useState, useEffect, useRef, useCallback } = React;

const PROXY_URL = window.VERCEL_PROXY_URL || '/api/proxy';

// ── Constants ─────────────────────────────────────────────────────────────────
const GIORNI_OPTIONS = ["ok","cheat","free meal"];

  {key:"aspettoVisivo",   label:"Aspetto visivo",        icon:"💪", sub:"Volumi, vascolarizzazione"},
  {key:"carichi",         label:"Carichi",               icon:"🏋️", sub:"Stabili, in aumento o calano?"},

  {key:"appetito",        label:"Appetito",              icon:"🍽️", sub:"In che momento della giornata?"},
  {key:"sonno",           label:"Sonno",                 icon:"😴", sub:"Ore e qualità"},

  {key:"bagno",           label:"Evacuazione",           icon:"🚽", sub:"Frequenza e tipo"},

];

const pad = n => String(n).padStart(2,"0");
const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const dateFromStr = s => { if(!s||s.length<10)return null; const [y,m,d]=s.split('-').map(Number); if(!y||!m||!d)return null; const dt=new Date(y,m-1,d); return isNaN(dt)?null:dt; };
const strFromDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const calcAge = dob => { if(!dob)return null; const [y,m,d]=dob.split('-').map(Number); const t=new Date(); let a=t.getFullYear()-y; if(t.getMonth()+1<m||(t.getMonth()+1===m&&t.getDate()<d))a--; return a; };
const avg = arr => { const v=arr.map(d=>parseFloat(typeof d==='object'?d.peso:d)).filter(v=>!isNaN(v)&&v>0); return v.length?parseFloat((v.reduce((a,b)=>a+b,0)/v.length).toFixed(2)):null; };
const fmtDate = d => d ? `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${String(d.getFullYear()).slice(2)}` : '';
const fmtDateStr = s => { const d=dateFromStr(s); return d?fmtDate(d):s; };

// ── Storage ───────────────────────────────────────────────────────────────────
const STORAGE_KEY = "fitness_report_v1";
const DIET_KEY    = "fitness_diet_v1";
const loadState   = () => { try { const r=localStorage.getItem(STORAGE_KEY); return r?JSON.parse(r):null; } catch(e){return null;} };
const saveState   = s => { try { localStorage.setItem(STORAGE_KEY,JSON.stringify(s)); } catch(e){} };
const loadDiet    = () => { try { const r=localStorage.getItem(DIET_KEY); return r?JSON.parse(r):null; } catch(e){return null;} };
const saveDiet    = d => { try { localStorage.setItem(DIET_KEY,JSON.stringify(d)); } catch(e){} };

// ── Cycle factory ─────────────────────────────────────────────────────────────
function makeNewCycle(startDate, mediaPesoPrec, cycleIndex, numDays) {
  const n = numDays||14;
  const days = Array.from({length:n},(_,i)=>{ const d=new Date(startDate); d.setDate(d.getDate()+i); return {data:strFromDate(d),giorno:"ok",peso:"",gruppiAllenati:"",bagnoVolte:"",feciTipo:""}; });
  return {id:cycleIndex,startDate:strFromDate(startDate),mediaPesoPrec:mediaPesoPrec??"",mediaPassiSett1:"",mediaPassiSett2:"",days,feedback:Object.fromEntries(SEZIONI_FEEDBACK.map(s=>[s.key,""])),completed:false,exported:false};
}

function getCycleStart(visitaStr) {
  if(!visitaStr)return new Date();
  const base=dateFromStr(visitaStr); if(!base)return new Date();
  const anchor=new Date(base); anchor.setDate(base.getDate()+1);
  const today=new Date(); today.setHours(0,0,0,0);
  const diffDays=Math.floor((today-anchor)/(24*60*60*1000));
  if(diffDays<0)return anchor;
  const cycleNum=Math.floor(diffDays/14);
  const s=new Date(anchor); s.setDate(anchor.getDate()+cycleNum*14);
  return s;
}

function daysUntilVisita(visitaStr) {
  if(!visitaStr)return null;
  const v=dateFromStr(visitaStr); if(!v)return null;
  const today=new Date(); today.setHours(0,0,0,0);
  return Math.floor((v-today)/(24*60*60*1000));
}

function writeToAppleHealth(date, weightKg) {
  const kg=parseFloat(weightKg); if(isNaN(kg)||kg<=0)return;
  const url=`shortcuts://run-shortcut?name=LogWeight&input=text&text=${kg}`;
  window.location.href=url;
}

const KCAL_DB = {
  "yogurt greco 0%":{"k":57,"p":10.0,"c":3.6,"g":0.2},
  "albume":{"k":52,"p":10.9,"c":0.7,"g":0.2},
  "whey isolate":{"k":371,"p":90.0,"c":3.5,"g":1.0},
  "whey protein isolate":{"k":371,"p":90.0,"c":3.5,"g":1.0},
  "latte":{"k":46,"p":3.3,"c":4.9,"g":1.5},
  "budino proteico milkpro":{"k":95,"p":20.0,"c":3.5,"g":0.9},
  "fiocchi di mais":{"k":368,"p":7.0,"c":83.6,"g":0.8},

  "pane":{"k":275,"p":8.1,"c":56.8,"g":0.5},

  "gallette":{"k":381,"p":8.0,"c":83.0,"g":1.0},
  "cereali":{"k":353,"p":11.0,"c":72.9,"g":1.1},
  "patate lesse":{"k":79,"p":2.1,"c":17.0,"g":0.1},
  "gnocchi di patate":{"k":130,"p":2.8,"c":28.6,"g":0.3},
  "legumi cotti":{"k":116,"p":7.7,"c":20.0,"g":0.5},
  "oro saiwa plasmon":{"k":435,"p":8.5,"c":75.0,"g":12.0},
  "carne magra":{"k":103,"p":22.3,"c":0.0,"g":1.2},
  "uova":{"k":128,"p":12.4,"c":0.5,"g":8.7},
  "pesce magro":{"k":82,"p":18.0,"c":0.0,"g":0.9},
  "pesce semigrasso":{"k":121,"p":20.0,"c":0.0,"g":4.3},
  "pesce grasso":{"k":185,"p":18.4,"c":0.0,"g":12.0},
  "fiocchi di latte":{"k":98,"p":11.0,"c":3.3,"g":4.3},
  "salmone affumicato":{"k":142,"p":20.5,"c":0.0,"g":6.8},
  "philadelphia protein":{"k":140,"p":11.0,"c":4.0,"g":9.0},
  "mozzarella protein":{"k":105,"p":17.0,"c":4.0,"g":2.0},

  "frutta secca":{"k":620,"p":17.0,"c":9.0,"g":57.0},
  "burro frutta secca":{"k":598,"p":25.0,"c":20.0,"g":50.0},

  "olio evo":{"k":899,"p":0.0,"c":0.0,"g":99.9},
  "olio di cocco":{"k":892,"p":0.0,"c":0.0,"g":99.1},
  "frutta":{"k":52,"p":0.3,"c":12.5,"g":0.1},
  "marmellata":{"k":241,"p":0.4,"c":61.5,"g":0.1},
  "miele":{"k":304,"p":0.3,"c":80.3,"g":0.0},
  "maltodestrine":{"k":380,"p":0.0,"c":95.0,"g":0.0},
  "eaa":{"k":400,"p":90.0,"c":5.0,"g":0.0},
  "creatina":{"k":0,"p":0.0,"c":0.0,"g":0.0},
};

function calcKcal(food, grams) {
  const key = Object.keys(KCAL_DB).find(k =>
    food.toLowerCase().includes(k) || k.includes(food.toLowerCase().split(' ')[0])
  );
  if(!key || !grams) return null;
  const db = KCAL_DB[key];
  const factor = grams/100;
  return {
    kcal: Math.round(db.k * factor),
    p: Math.round(db.p * factor * 10)/10,
    c: Math.round(db.c * factor * 10)/10,
    g: Math.round(db.g * factor * 10)/10,
    key
  };
}

// Parse a meal option string like "200 gr YOGURT GRECO 0%" into {grams, food, label}
function parseMealOption(str) {
  str = str.trim();
  const m = str.match(/^(\d+)\s*gr?\s+(.+)$/i);
  if(m) return {grams: parseInt(m[1]), food: m[2].toLowerCase(), label: str};
  // Handle "X uova" or "X cucchiai"
  const m2 = str.match(/^(\d+)\s+(uov[ao]|cucchiai?|tazza|bicchiere)\s*(.*)$/i);
  if(m2) {
    const unit = m2[2].toLowerCase();
    const grams = unit.startsWith('uov') ? parseInt(m2[1])*60 :
                  unit.startsWith('cucch') ? parseInt(m2[1])*10 :
                  unit.startsWith('tazza') ? 250 : 200;
    return {grams, food: (unit.startsWith('uov')?'uova ':'')+m2[3].toLowerCase(), label: str};
  }
  return {grams: null, food: str.toLowerCase(), label: str};
}

// ── Diet storage ───────────────────────────────────────────────────────────────
const DIET_KEY = "fitness_diet_v1";

// ── Diet storage helpers ──────────────────────────────────────────────────────
function MealOptionSelector({meal, selectedIdx, grams, onSelect, onGramsChange}) {
  if(!meal || !meal.options || meal.options.length === 0) return null;
  const selectedOpt = selectedIdx != null ? (meal.options[selectedIdx]?.label || meal.options[selectedIdx]) : null;
  const selectedParsed = selectedOpt ? parseMealOption(selectedOpt) : null;
  const gramsVal = grams != null && grams !== "" ? parseFloat(grams) : (selectedParsed?.grams || null);
  const nutrition = selectedOpt && gramsVal ? calcKcal(selectedParsed?.food || selectedOpt.toLowerCase(), gramsVal) : null;

  return (
    <div style={{marginBottom:14}}>
      <div style={{fontSize:11,fontWeight:700,color:'var(--t3)',letterSpacing:0.8,textTransform:'uppercase',marginBottom:8}}>{meal.label}</div>
      <div style={{display:'flex',flexDirection:'column',gap:6}}>
        {meal.options.map((opt,i)=>{
          const label = opt.label||opt;
          const displayLabel = label.replace(/^\d+\s*gr?\s*/i,'').replace(/^\d+\s*uov[ae]\s*/i,'').trim();
          const defaultG = parseMealOption(label).grams;
          const isSelected = selectedIdx === i;
          return (
            <button key={i} onClick={()=>onSelect(i)} className="tappable" style={{
              width:'100%', padding:'12px 14px', borderRadius:14, cursor:'pointer',
              border:`1.5px solid ${isSelected?'var(--accent)':'var(--border)'}`,
              background:isSelected?'var(--accent-dim)':'var(--surface)',
              textAlign:'left',
            }}>
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                {isSelected && <span style={{color:'var(--accent)',fontSize:13,flexShrink:0}}>✓</span>}
                <span style={{fontSize:14,fontWeight:isSelected?700:500,color:isSelected?'var(--t1)':'var(--t2)',flex:1}}>{displayLabel}</span>
                {defaultG && !isSelected && <span style={{fontSize:11,color:'var(--t3)'}}>{defaultG}g</span>}
              </div>
            </button>
          );
        })}
      </div>
      {selectedIdx != null && (
        <div style={{marginTop:10,display:'flex',gap:12,alignItems:'center',background:'var(--surface)',borderRadius:12,padding:'10px 14px',border:'1px solid var(--border)'}}>
          <div style={{flex:1}}>
            <div style={{fontSize:11,color:'var(--t3)',fontWeight:700,marginBottom:6}}>Grammature (g)</div>
            <input type="number" value={grams||""} onChange={e=>onGramsChange(e.target.value)}
              placeholder={selectedParsed?.grams ? String(selectedParsed.grams) : "es. 150"}
              style={{width:'100%',padding:'8px 10px',borderRadius:8,border:'1.5px solid var(--border2)',
                fontSize:16,fontWeight:700,background:'var(--bg3)',color:'var(--t1)',outline:'none',
                textAlign:'center',fontFamily:'inherit'}}/>
          </div>
          {nutrition && (
            <div style={{textAlign:'right',flexShrink:0}}>
              <div style={{fontSize:18,fontWeight:900,color:'var(--accent)'}}>{nutrition.kcal}</div>
              <div style={{fontSize:10,color:'var(--t3)'}}>kcal</div>
              <div style={{fontSize:10,color:'var(--t3)'}}>P{nutrition.p} C{nutrition.c} G{nutrition.g}</div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ── parseExcelToAppData ───────────────────────────────────────────────────────
function parseExcelToAppData(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const cell = addr => { const c=ws[addr]; return c?String(c.v||'').trim():''; };
        const num  = addr => { const c=ws[addr]; return c&&c.v!=null?String(parseFloat(c.v).toFixed(2)):''; };
        const xval = s => (s.split('=')[1]||'').trim();
        const nomeRaw = xval(cell('B3'));
        const cognome = xval(cell('B5'));
        const nome    = cognome ? nomeRaw.replace(cognome,'').trim() : nomeRaw;
        const altezza = xval(cell('F5'));
        const reportDate = xval(cell('I3'));
        const passiRaw = cell('J5') || cell('K5') || cell('I5') || '';
        const passiLines = passiRaw.split(/\r?\n|\r/).filter(l=>l.trim());
        const afterEq = s => { const m=s.match(/=\s*(\d+)/); return m?m[1]:''; };
        const passi1 = passiLines[0] ? afterEq(passiLines[0]) : '';
        const passi2 = passiLines[1] ? afterEq(passiLines[1]) : '';
        const mediaPesoPrec = num('E10');
        const week1=[], week2=[];
        for(let r=15;r<=21;r++){const d=cell(`D${r}`);if(d)week1.push({data:d,giorno:cell(`B${r}`)||'ok',peso:num(`F${r}`),gruppiAllenati:cell(`H${r}`)==='-'?'':cell(`H${r}`)});}
        for(let r=28;r<=34;r++){const d=cell(`D${r}`);if(d)week2.push({data:d,giorno:cell(`B${r}`)||'ok',peso:num(`F${r}`),gruppiAllenati:cell(`H${r}`)==='-'?'':cell(`H${r}`)});}
        const allDays=[...week1,...week2];
        const fbMap={aspettoVisivo:'B42',carichi:'B53',sensazioni:'B64',appetito:'B75',sonno:'B86',pianoAlimentare:'B97',bagno:'B108',integratori:'B119',servizio:'B130',varie:'B141'};
        const feedback=Object.fromEntries(Object.entries(fbMap).map(([k,a])=>[k,cell(a)]));
        const dob=''; // not in Excel
        const startDate=allDays[0]?.data||reportDate;
        resolve({profile:{nome,cognome,altezza,dob,visitaNutrizionista:reportDate,mediaPesoPrecIniziale:mediaPesoPrec},cycle:{startDate,mediaPesoPrec,mediaPassiSett1:passi1,mediaPassiSett2:passi2,days:allDays,feedback,completed:true,exported:true,mediaS1:'',mediaS2:''}});
      } catch(err){reject(err);}
    };
    reader.onerror=()=>reject(new Error('Errore lettura file'));
    reader.readAsArrayBuffer(file);
  });
}

// ── ExportButton ──────────────────────────────────────────────────────────────
function ExportButton({profile, cycle, onConfirm, label="📊 Genera Report Excel", small=false}) {
  const [loading, setLoading] = useState(false);
  const [done, setDone] = useState(false);
  const today = todayStr();
  const age = calcAge(profile.dob);

  const doExport=async()=>{
    setLoading(true);
    try {
      const today2 = today || todayStr();
      const half = Math.ceil(cycle.days.length/2);
      const s1days = cycle.days.slice(0,half);
      const s2days = cycle.days.slice(half);
      const pad7 = (arr) => [...arr, ...Array(Math.max(0,7-arr.length)).fill({giorno:'',data:'',peso:'',gruppiAllenati:''})].slice(0,7);
      const s1 = pad7(s1days);
      const s2 = pad7(s2days);
      const wb = XLSX.utils.book_new();
      const ws = {};
      const C = (addr, v, t) => { ws[addr] = {v, t: t||(typeof v==='number'?'n':'s'), s:{}}; };
      const N = (addr, v) => C(addr, v, 'n');
      const S = (addr, v) => C(addr, String(v||''), 's');
      ws['!ref'] = 'A1:R155';
      ws['!cols'] = [{wch:8},{wch:12},{wch:12},{wch:14},{wch:8},{wch:10},{wch:13.33},{wch:22},{wch:8},{wch:10},{wch:10},{wch:10},{wch:20},{wch:12},{wch:12},{wch:12},{wch:12},{wch:12}];
      ws['!rows'] = Array(155).fill(null).map(()=>({hpx:15}));
      S('B3', `NOME= ${profile.nome||''} ${profile.cognome||''}`);
      S('F3', `Età= ${age||''}`);
      S('I3', `DATA= ${today2}`);
      S('B5', `COGNOME= ${profile.cognome||''}`);
      S('F5', `ALTEZZA= ${profile.altezza||''}`);
      S('J5', `MEDIA PASSI SETTIMANA 1=${cycle.mediaPassiSett1||''}\nMEDIA PASSI SETTIMANA 2= ${cycle.mediaPassiSett2||''}`);
      S('C8', 'ULTIMA SETTIMANA REPORT PRECEDENTE');
      S('C10', 'MEDIA PESO '); S('D10', '→');
      const mpVal = parseFloat(cycle.mediaPesoPrec);
      if (!isNaN(mpVal)) N('E10', mpVal);
      S('C13', ' PRIMA SETTIMANA REPORT ');
      S('B14','GIORNO'); S('D14','DATA'); S('F14','PESO'); S('H14','GRUPPI ALLENATI');
      s1.forEach((d,i)=>{ const r=15+i; S(`B${r}`,d.giorno||''); S(`D${r}`,d.data||''); const p=parseFloat(d.peso); if(!isNaN(p)&&p>0)N(`F${r}`,p); S(`H${r}`,d.gruppiAllenati||''); });
      S('C23','MEDIA PESO ');
      const m1v=s1.map(d=>parseFloat(d.peso)).filter(v=>!isNaN(v)&&v>0);
      const m1=m1v.length?parseFloat((m1v.reduce((a,b)=>a+b,0)/m1v.length).toFixed(2)):null;
      if(m1!==null)N('D23',m1); S('G23','DELTA PESO ');
      if(m1!==null&&!isNaN(mpVal))N('H23',parseFloat((mpVal-m1).toFixed(2)));
      S('C26',' SECONDA SETTIMANA REPORT ');
      S('B27','GIORNO'); S('D27','DATA'); S('F27','PESO'); S('H27','GRUPPI ALLENATI');
      s2.forEach((d,i)=>{ const r=28+i; S(`B${r}`,d.giorno||''); S(`D${r}`,d.data||''); const p=parseFloat(d.peso); if(!isNaN(p)&&p>0)N(`F${r}`,p); S(`H${r}`,d.gruppiAllenati||''); });
      S('C36','MEDIA PESO ');
      const m2v=s2.map(d=>parseFloat(d.peso)).filter(v=>!isNaN(v)&&v>0);
      const m2=m2v.length?parseFloat((m2v.reduce((a,b)=>a+b,0)/m2v.length).toFixed(2)):null;
      if(m2!==null)N('D36',m2); S('G36','DELTA PESO ');
      if(m1!==null&&m2!==null)N('H36',parseFloat((m1-m2).toFixed(2)));
      const fbDef=[
        {lr:41,tr:42,key:'aspettoVisivo',lbl:'ASPETTO VISIVO IN ALLENAMENTO  (ES VOLUMI, VASCOLARIZZAZIONE).'},
        {lr:52,tr:53,key:'carichi',lbl:'CARICHI STABILI, IN AUMENTO O DIMINUISCONO?'},
        {lr:63,tr:64,key:'sensazioni',lbl:'SENSAZIONI IN ALLENAMENTO.'},
        {lr:74,tr:75,key:'appetito',lbl:'APPETITO. IN CHE MOMENTO DELLA GIORNATA?'},
        {lr:85,tr:86,key:'sonno',lbl:'ORE DI SONNO. RIPOSI BENE?'},
        {lr:96,tr:97,key:'pianoAlimentare',lbl:'COME TI STAI TROVANDO CON IL PIANO ALIMENTARE?'},
        {lr:107,tr:108,key:'bagno',lbl:'QUANTE VOLTE VAI IN BAGNO? ASPETTO DELLE FECI 1-7.'},
        {lr:118,tr:119,key:'integratori',lbl:'INTEGRATORI UTILIZZATI IN QUESTO MOMENTO. INDICARE ANCHE I GR.'},
        {lr:129,tr:130,key:'servizio',lbl:'SEI CONTENTO DEL SERVIZIO OFFERTO? COME TI STAI TROVANDO?'},
        {lr:140,tr:141,key:'varie',lbl:'VARIE.'},
      ];
      fbDef.forEach(({lr,tr,key,lbl})=>{ S(`B${lr}`,lbl); S(`B${tr}`,cycle.feedback&&cycle.feedback[key]?cycle.feedback[key]:''); });
      ws['!merges']=[
        {s:{r:2,c:1},e:{r:2,c:3}},{s:{r:2,c:5},e:{r:2,c:6}},{s:{r:2,c:8},e:{r:2,c:9}},
        {s:{r:4,c:1},e:{r:4,c:3}},{s:{r:4,c:5},e:{r:4,c:6}},{s:{r:4,c:9},e:{r:6,c:12}},
        {s:{r:7,c:2},e:{r:7,c:7}},{s:{r:12,c:2},e:{r:12,c:7}},
        {s:{r:13,c:1},e:{r:13,c:2}},{s:{r:13,c:3},e:{r:13,c:4}},{s:{r:13,c:5},e:{r:13,c:6}},{s:{r:13,c:7},e:{r:13,c:9}},
        {s:{r:25,c:2},e:{r:25,c:7}},
        {s:{r:26,c:1},e:{r:26,c:2}},{s:{r:26,c:3},e:{r:26,c:4}},{s:{r:26,c:5},e:{r:26,c:6}},{s:{r:26,c:7},e:{r:26,c:9}},
      ];
      for(let i=0;i<7;i++){const r=14+i; ws['!merges'].push({s:{r,c:1},e:{r,c:2}},{s:{r,c:3},e:{r,c:4}},{s:{r,c:5},e:{r,c:6}},{s:{r,c:7},e:{r,c:9}});}
      for(let i=0;i<7;i++){const r=27+i; ws['!merges'].push({s:{r,c:1},e:{r,c:2}},{s:{r,c:3},e:{r,c:4}},{s:{r,c:5},e:{r,c:6}},{s:{r,c:7},e:{r,c:9}});}
      fbDef.forEach(({lr,tr})=>{ ws['!merges'].push({s:{r:lr-1,c:1},e:{r:lr-1,c:8}}); ws['!merges'].push({s:{r:tr-1,c:1},e:{r:tr+6,c:8}}); });
      XLSX.utils.book_append_sheet(wb,ws,'Foglio1');
      const wbout=XLSX.write(wb,{bookType:'xlsx',type:'array'});
      const blob=new Blob([wbout],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download=`${today2}.xlsx`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    } catch(e) { alert('Errore: '+e.message); }
    setLoading(false); setDone(true); if(onConfirm)onConfirm();
  };

  if(done) return (
    <div style={{background:'var(--accent-dim)',borderRadius:14,padding:'14px 16px',display:'flex',alignItems:'center',gap:10,border:'1px solid var(--accent-glow)'}}>
      <span style={{fontSize:20}}>✅</span>
      <div style={{fontSize:14,fontWeight:700,color:T.accent}}>Report Excel generato</div>
    </div>
  );
  return (
    <button onClick={doExport} disabled={loading} className="rf-btn rf-btn-primary tappable"
      style={{fontSize:small?14:16,padding:small?'12px':'16px'}}>
      {loading ? '⏳ Generazione…' : label}
    </button>
  );
}


// ── ScreenImportExcel ─────────────────────────────────────────────────────────
function ScreenImportExcel({onImport, onBack}) {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(false);
  const fileRef = useRef();

  const handleFiles = async (e) => {
    const files = Array.from(e.target.files);
    if(!files.length) return;
    setLoading(true);
    const results = await Promise.all(files.map(async f => {
      try { const data = await parseExcelToAppData(f); return {fileName:f.name,status:'ok',...data}; }
      catch(err){return {fileName:f.name,status:'error',error:err.message};}
    }));
    setItems(prev=>{
      const merged=[...prev,...results];
      const seen=new Set(); return merged.filter(x=>{ if(seen.has(x.fileName))return false; seen.add(x.fileName); return true; });
    });
    setLoading(false); e.target.value='';
  };

  const removeItem=(idx)=>setItems(prev=>prev.filter((_,i)=>i!==idx));
  const validItems=items.filter(x=>x.status==='ok');

  const handleConfirm=()=>{
    const sorted=validItems.slice().sort((a,b)=>{
      const da=dateFromStr(a.cycle.startDate),db=dateFromStr(b.cycle.startDate);
      return da&&db?da-db:0;
    });
    const cycles=sorted.map((item,i)=>({
      id:i, ...item.cycle,
      completed:true, exported:true,
      mediaS1: item.cycle.mediaS1||'', mediaS2: item.cycle.mediaS2||'',
      mediaBagnoVolte:'', mediaFeciTipo:'',
      feedback:item.cycle.feedback||Object.fromEntries(SEZIONI_FEEDBACK.map(s=>[s.key,''])),
    }));
    const profile=sorted[sorted.length-1].profile;
    onImport(profile,cycles);
  };

  return (
    <div className="screen">
      <NavBar title="Importa Report" onBack={onBack}/>
      <div className="page-content" style={{paddingTop:16}}>
        <GlassCard style={{background:'linear-gradient(135deg,rgba(0,200,150,0.15),rgba(0,200,150,0.05))',border:'1px solid var(--accent-glow)',marginBottom:16}}>
          <div style={{fontSize:16,fontWeight:800,color:T.accent,marginBottom:6}}>📂 Importa storico Excel</div>
          <div style={{fontSize:13,color:T.t2,lineHeight:1.6}}>Seleziona uno o più file .xlsx dei report precedenti. Verranno importati in ordine cronologico.</div>
        </GlassCard>

        <input ref={fileRef} type="file" accept=".xlsx,.xls" multiple onChange={handleFiles} style={{display:'none'}}/>
        <button onClick={()=>fileRef.current.click()} disabled={loading} className="rf-btn rf-btn-secondary tappable" style={{marginBottom:16}}>
          {loading?'⏳ Caricamento…':'+ Aggiungi file .xlsx'}
        </button>

        {items.map((item,i)=>(
          <GlassCard key={i} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 14px'}}>
            <span style={{fontSize:20}}>{item.status==='ok'?'✅':'❌'}</span>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,fontWeight:700,color:T.t1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.fileName}</div>
              {item.status==='ok'
                ? <div style={{fontSize:11,color:T.t3,marginTop:2}}>{item.cycle.startDate} · {item.profile.nome} {item.profile.cognome}</div>
                : <div style={{fontSize:11,color:T.coral,marginTop:2}}>{item.error}</div>}
            </div>
            <button onClick={()=>removeItem(i)} style={{background:'none',border:'none',color:T.t3,fontSize:18,cursor:'pointer',padding:4}}>×</button>
          </GlassCard>
        ))}

        {validItems.length>0&&(
          <div style={{marginTop:8}}>
            <RFBtn onClick={handleConfirm}>
              ✓ Importa {validItems.length} ciclo{validItems.length>1?'i':''}
            </RFBtn>
          </div>
        )}
      </div>
    </div>
  );
}

// ── ScreenSetup ───────────────────────────────────────────────────────────────
function ScreenSetup({onDone, onImport, prefill}) {
  const [nome, setNome]=useState(prefill?.nome||"");
  const [cognome,setCognome]=useState(prefill?.cognome||"");
  const [altezza,setAltezza]=useState(prefill?.altezza||"");
  const [dob,setDob]=useState(prefill?.dob||"");
  const [visita,setVisita]=useState(prefill?.visitaNutrizionista||"");
  const [mediaPesoPrec,setMediaPesoPrec]=useState(prefill?.mediaPesoPrecIniziale||"");
  const age=dob.length===10?calcAge(dob):null;
  const visitaOk=visita.length===10&&!!dateFromStr(visita);
  const valid=nome.trim()&&cognome.trim()&&altezza&&dob.length===10;

  return (
    <div className="screen" style={{background:'var(--bg)'}}>
      <div style={{padding:'calc(var(--safe-top) + 32px) 20px 40px',textAlign:'center'}}>

        <div style={{fontSize:28,fontWeight:900,color:T.t1,letterSpacing:-0.8,marginBottom:6}}>Report Fit</div>
        <div style={{fontSize:15,color:T.t3,marginBottom:36}}>Il tuo tracker bisettimanale</div>
      </div>
      <div style={{padding:'0 20px 40px'}}>
        {[
          {label:'Nome',val:nome,set:setNome,ph:'Mario'},
          {label:'Cognome',val:cognome,set:setCognome,ph:'Rossi'},
          {label:'Altezza (cm)',val:altezza,set:setAltezza,ph:'175',type:'number'},
          {label:'Data di nascita',val:dob,set:setDob,ph:'YYYY-MM-DD'},
        ].map(({label,val,set,ph,type})=>(
          <div key={label} style={{marginBottom:14}}>
            <div style={{fontSize:12,fontWeight:700,color:T.t3,marginBottom:6,letterSpacing:0.5}}>{label.toUpperCase()}</div>
            <RFInput value={val} onChange={set} placeholder={ph} type={type||'text'}/>

        <div style={{marginBottom:14}}>
          <div style={{fontSize:12,fontWeight:700,color:T.t3,marginBottom:6,letterSpacing:0.5}}>DATA VISITA NUTRIZIONISTA</div>
          <RFInput value={visita} onChange={setVisita} placeholder="YYYY-MM-DD"/>

        </div>
        <div style={{marginBottom:24}}>
          <div style={{fontSize:12,fontWeight:700,color:T.t3,marginBottom:6,letterSpacing:0.5}}>PESO PRECEDENTE (kg)</div>
          <RFInput value={mediaPesoPrec} onChange={setMediaPesoPrec} placeholder="es. 72.5" type="number"/>

        {onImport&&(
          <button onClick={onImport} style={{width:'100%',background:'none',border:'none',color:T.t3,fontSize:14,fontWeight:600,cursor:'pointer',padding:'12px',fontFamily:'inherit'}}>
            Hai già report Excel? Importali
          </button>
        )}

  );
}


// ── TAB: Oggi (Home) ──────────────────────────────────────────────────────────
function TabOggi({profile, cycles, onOpenDay, onNewCycle, onDeleteCycle, onChiudiCiclo, onSavePassi}) {
  const cycle = cycles.length>0 ? cycles[cycles.length-1] : null;
  const today = todayStr();
  const todayIdx = cycle ? cycle.days.findIndex(d=>d.data===today) : -1;
  const todayDay = cycle&&todayIdx>=0 ? cycle.days[todayIdx] : null;
  const closedCycle = cycles.slice().reverse().find(c=>c.exported&&!c.completed)||null;
  const cycleIsEmpty = cycle&&!cycle.exported&&!cycle.days.some(d=>d.peso&&parseFloat(d.peso)>0);
  const visitaDays = profile.visitaNutrizionista ? daysUntilVisita(profile.visitaNutrizionista) : null;
  const half = cycle ? Math.ceil(cycle.days.length/2) : 7;
  const age = calcAge(profile.dob);
  const WD = ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];

  // Auto-close effect
  useEffect(()=>{
    if(!cycle||cycle.exported)return;
    const lastDay=cycle.days[cycle.days.length-1]; if(!lastDay)return;
    const lastDate=dateFromStr(lastDay.data), todayDate=dateFromStr(today);
    const hasSomeData=cycle.days.some(d=>d.peso&&parseFloat(d.peso)>0);
    if(lastDate&&todayDate&&todayDate>lastDate&&hasSomeData) onChiudiCiclo();
  },[today,cycle?.id,cycle?.exported]);

  return (
    <div style={{paddingBottom:'calc(var(--tab-h) + var(--safe-bottom) + 24px)'}}>
      {/* Hero */}
      <div style={{
        background:'linear-gradient(160deg,#0D1F1A 0%,#091510 60%,var(--bg) 100%)',
        padding:`calc(var(--safe-top) + 20px) 20px 24px`,
        borderBottom:'1px solid var(--border)',
      }}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:20}}>
          <div>
            <div style={{fontSize:13,color:T.t3,fontWeight:600}}>Ciao, {profile.nome} 👋</div>
            <div style={{fontSize:26,fontWeight:900,color:T.t1,letterSpacing:-0.8,marginTop:2}}>
              {todayDay?.peso ? (
                <><span style={{color:T.accent}}>{todayDay.peso}</span> <span style={{fontSize:16,color:T.t3,fontWeight:500}}>kg oggi</span></>
              ) : cycle&&!cycle.exported ? (
                <span style={{color:T.t4}}>— kg oggi</span>
              ) : '—'}
            </div>
          </div>
          {visitaDays!==null&&visitaDays>=0&&visitaDays<=7&&(
            <div style={{background:'var(--amber-dim)',border:'1px solid rgba(255,159,10,0.3)',borderRadius:10,padding:'6px 10px',textAlign:'center'}}>
              <div style={{fontSize:10,fontWeight:700,color:T.amber}}>VISITA</div>
              <div style={{fontSize:18,fontWeight:900,color:T.amber}}>{visitaDays}g</div>
            </div>
          )}
        </div>

        {/* CTA principale — tap today */}
        {cycle&&!cycle.exported&&todayIdx>=0&&(
          <button onClick={()=>onOpenDay(todayIdx)} className="tappable" style={{
            width:'100%', padding:'16px', borderRadius:18,
            background:todayDay?.peso?'var(--accent-dim)':'var(--accent)',
            border:`1.5px solid ${todayDay?.peso?'var(--accent-glow)':'transparent'}`,
            color:todayDay?.peso?T.accent:'#000',
            fontSize:16, fontWeight:800, cursor:'pointer', fontFamily:'inherit',
            display:'flex', alignItems:'center', justifyContent:'space-between',
          }}>
            <span>{todayDay?.peso ? `✓ Peso: ${todayDay.peso} kg` : '+ Inserisci il peso di oggi'}</span>
            <span style={{fontSize:20}}>›</span>
          </button>
        )}
        {cycle&&!cycle.exported&&todayIdx<0&&(
          <div style={{background:'var(--surface)',borderRadius:14,padding:'14px 16px',textAlign:'center',color:T.t3,fontSize:14}}>
            Oggi non è nel calendario del ciclo corrente
          </div>
        )}
      </div>

      <div style={{padding:'16px 16px 0'}}>
        {/* Cycle closed CTA */}
        {closedCycle&&(
          <GlassCard style={{border:'1px solid rgba(255,159,10,0.25)',background:'var(--amber-dim)',marginBottom:10}}>
            <div style={{fontSize:13,fontWeight:700,color:T.amber,marginBottom:6}}>⚠️ Ciclo #{(closedCycle.id||0)+1} completato</div>
            <div style={{fontSize:12,color:T.t2,marginBottom:0}}>Compila feedback e genera il report per sbloccare il prossimo ciclo.</div>
          </GlassCard>
        )}

        {/* Calendar strip */}
        {cycle&&!cycle.exported&&(
          <>
            <SectionLabel>Calendario ciclo #{cycle.id+1}</SectionLabel>
            <div className="cal-strip">
              {cycle.days.map((d,idx)=>{
                const dt=dateFromStr(d.data);
                const isT=d.data===today, isFuture=dt&&dateFromStr(today)&&dt>dateFromStr(today);
                const hasData=!!d.peso;
                const dotColor=d.giorno==='ok'?T.ok:d.giorno==='cheat'?T.cheat:T.free;
                return (
                  <div key={idx}
                    className={`cal-day${isT?' today':''}${hasData?' has-data':''}${isFuture?' future':''}`}
                    onClick={()=>!isFuture&&onOpenDay(idx)}>
                    <div className="day-wd">{dt?WD[dt.getDay()]:''}</div>
                    <div className="day-num" style={{color:isT?T.accent:hasData?T.t1:T.t3}}>{dt?dt.getDate():'?'}</div>
                    <div className="day-dot" style={{background:hasData?dotColor:'transparent',border:hasData?'none':'1px solid var(--t4)'}}/>
                    <div style={{fontSize:8,color:T.t4,fontWeight:600}}>{idx<half?'S1':'S2'}</div>
                  </div>
                );
              })}
            </div>
          </>
        )}

        {/* Metrics */}
        {cycle&&!cycle.exported&&(()=>{
          const s1=cycle.days.slice(0,half), s2=cycle.days.slice(half);
          const m1=avg(s1.filter(d=>d.peso)), m2=avg(s2.filter(d=>d.peso));
          const mp=parseFloat(cycle.mediaPesoPrec);
          const filled=cycle.days.filter(d=>d.peso).length;
          return (
            <div style={{marginTop:14}}>
              <MetricRow metrics={[
                {label:'Media S1',value:m1?`${m1}`:null,unit:'kg',color:T.accent},
                {label:'Media S2',value:m2?`${m2}`:null,unit:'kg',color:T.blue},
                {label:'Prec.',value:!isNaN(mp)?`${mp}`:null,unit:'kg',color:T.t3},
              ]}/>
              <MetricRow metrics={[
                {label:'Giorni',value:`${filled}/${cycle.days.length}`,color:T.t1},
                {label:'Δ Prec→S1',value:m1&&!isNaN(mp)?`${(mp-m1).toFixed(1)}`:null,unit:'kg',color:m1&&!isNaN(mp)?(mp-m1)<0?T.coral:T.ok:T.t3},
                {label:'Δ S1→S2',value:m1&&m2?`${(m1-m2).toFixed(1)}`:null,unit:'kg',color:m1&&m2?(m1-m2)<0?T.coral:T.ok:T.t3},
              ]}/>
            </div>
          );
        })()}

        {/* Passi */}
        <PassiCard cycle={cycle} onSave={onSavePassi}/>

        {/* New cycle / delete */}
        {(!cycle||cycle.exported)&&!closedCycle&&(
          <button onClick={onNewCycle} className="tappable" style={{
            width:'100%',padding:'20px',borderRadius:18,
            border:'1.5px dashed var(--accent)',background:'var(--accent-dim)',
            color:T.accent,fontSize:16,fontWeight:800,cursor:'pointer',fontFamily:'inherit',
            display:'flex',alignItems:'center',justifyContent:'center',gap:10,marginTop:10,
          }}>
            <span style={{fontSize:22}}>＋</span>
            {cycle?'Inizia nuovo ciclo bisettimanale':'Inizia il primo ciclo'}
          </button>
        )}
        {cycleIsEmpty&&onDeleteCycle&&(
          <button onClick={()=>{if(window.confirm(`Eliminare il ciclo #${cycle.id+1} (nessun dato)?`))onDeleteCycle(cycle.id);}}
            style={{width:'100%',padding:'12px',borderRadius:12,border:'1px solid rgba(255,107,107,0.3)',
              background:'var(--coral-dim)',color:T.coral,fontSize:13,fontWeight:700,
              cursor:'pointer',marginTop:8,fontFamily:'inherit'}}>
            🗑 Elimina ciclo #{cycle.id+1} (vuoto)
          </button>
        )}
      </div>
    </div>
  );
}

// ── ScreenDay (bottom sheet style, full screen) ───────────────────────────────

  const day = cycle.days[dayIdx];
  const [giorno,setGiorno]=useState(day.giorno||'ok');
  const [peso,setPeso]=useState(day.peso||'');
  const [gruppi,setGruppi]=useState(day.gruppiAllenati||'');
  const [bagnoVolte,setBagnoVolte]=useState(day.bagnoVolte||'');
  const [feciTipo,setFeciTipo]=useState(day.feciTipo||'');
  const isToday=day.data===todayStr();
  const half=Math.ceil(cycle.days.length/2);
  const weekNum=dayIdx<half?1:2;
  const dayNum=(dayIdx%half)+1;
  const dt=dateFromStr(day.data);
  const WD=['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
  const feciDesc=['','Palline dure separate','Salsiccia grumosa','Salsiccia con crepe','Morbida e liscia ✓','Morbide con bordi netti','Poltacee','Acquose'];

  return (

      <div className="page-content" style={{paddingTop:16}}>

        {/* Peso hero */}
        <GlassCard style={{textAlign:'center',padding:'24px 20px',background:'linear-gradient(135deg,rgba(0,200,150,0.08),rgba(0,200,150,0.02))'}}>
          <div style={{fontSize:12,fontWeight:700,color:T.t3,letterSpacing:0.8,marginBottom:8}}>PESO CORPOREO</div>
          <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
            <input className="peso-input" type="number" value={peso} onChange={e=>setPeso(e.target.value)}
              placeholder="72.5" inputMode="decimal" autoFocus={isToday}/>
            <span style={{fontSize:22,fontWeight:600,color:T.t3}}>kg</span>
          </div>
        </GlassCard>

        {/* Tipo giornata */}
        <GlassCard>
          <div style={{fontSize:12,fontWeight:700,color:T.t3,letterSpacing:0.8,marginBottom:12}}>TIPO GIORNATA</div>
          <SegControl options={GIORNI_OPTIONS} value={giorno} onChange={setGiorno}

          <div style={{marginTop:10,display:'flex',gap:12,flexWrap:'wrap'}}>
            {[{l:'OK',c:T.ok,d:'Piano rispettato'},{l:'Free',c:T.free,d:'Grammature rispettate'},{l:'Cheat',c:T.cheat,d:'Sforato'}].map(x=>(
              <div key={x.l} style={{display:'flex',alignItems:'center',gap:4}}>
                <span style={{width:6,height:6,borderRadius:3,background:x.c,display:'inline-block'}}/>
                <span style={{fontSize:11,color:T.t3}}><b style={{color:x.c}}>{x.l}</b> = {x.d}</span>
              </div>
            ))}
          </div>
        </GlassCard>

        {/* Gruppi */}
        <GlassCard>
          <div style={{fontSize:12,fontWeight:700,color:T.t3,letterSpacing:0.8,marginBottom:10}}>GRUPPI ALLENATI</div>
          <RFInput value={gruppi} onChange={setGruppi} placeholder="Es. Schiena e Bicipiti"/>
        </GlassCard>

        {/* Evacuazione */}
        <GlassCard>
          <div style={{fontSize:12,fontWeight:700,color:T.t3,letterSpacing:0.8,marginBottom:12}}>🚽 EVACUAZIONE</div>
          <div style={{display:'flex',gap:12,alignItems:'flex-start'}}>
            <div style={{flex:1}}>
              <div style={{fontSize:11,color:T.t3,marginBottom:8}}>Volte al giorno</div>
              <RFInput type="number" value={bagnoVolte} onChange={setBagnoVolte} placeholder="1" center/>
            </div>
            <div style={{flex:2}}>
              <div style={{fontSize:11,color:T.t3,marginBottom:8}}>Tipo feci (scala di Bristol)</div>
              <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
                {[1,2,3,4,5,6,7].map(n=>(
                  <button key={n} onClick={()=>setFeciTipo(feciTipo===String(n)?'':String(n))}
                    className={`feci-btn${feciTipo===String(n)?' sel':''}`}>{n}</button>
                ))}
              </div>
              {feciTipo&&<div style={{fontSize:11,color:T.t3,marginTop:8,lineHeight:1.5}}>{feciDesc[parseInt(feciTipo)]||''}</div>}

              background:'rgba(255,59,48,0.1)',color:'#FF3B30',fontSize:15,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>

    </div>

// ── Chiusura ciclo — schermata unificata (Feedback + Report + ProssimaVisita) ─
function ScreenChiusuraCiclo({profile, cycle, onSaveAndClose, onBack}) {
  const [fb, setFb] = useState({...cycle.feedback});
  const [nuovaVisita, setNuovaVisita] = useState('');
  const [step, setStep] = useState(0); // 0=riepilogo, 1=feedback, 2=export
  const [exported, setExported] = useState(false);
  const half = Math.ceil(cycle.days.length/2);
  const s1 = cycle.days.slice(0,half), s2 = cycle.days.slice(half);
  const m1 = cycle.mediaS1 ? parseFloat(cycle.mediaS1) : avg(s1);
  const m2 = cycle.mediaS2 ? parseFloat(cycle.mediaS2) : avg(s2);
  const mp = parseFloat(cycle.mediaPesoPrec);
  const fbFilled = SEZIONI_FEEDBACK.filter(s=>fb[s.key]?.trim()).length;
  const fbDone = fbFilled === SEZIONI_FEEDBACK.length;
  const visitaOk = nuovaVisita.length===10&&!!dateFromStr(nuovaVisita);

  const steps = [
    {id:0, label:'Riepilogo'},
    {id:1, label:'Feedback'},
    {id:2, label:'Report'},
  ];

  const handleExported = () => {
    setExported(true);
    onSaveAndClose(fb, nuovaVisita);
  };

  return (
    <div className="screen" style={{background:'var(--bg)'}}>
      <NavBar title={`Chiusura Ciclo #${cycle.id+1}`} onBack={onBack}/>

      {/* Step indicator */}
      <div style={{padding:'12px 20px',display:'flex',gap:8,borderBottom:'1px solid var(--border)'}}>
        {steps.map((s,i)=>(
          <button key={s.id} onClick={()=>setStep(s.id)} style={{
            flex:1,padding:'8px 4px',borderRadius:10,border:'none',
            background:step===s.id?'var(--accent-dim)':'var(--surface)',
            color:step===s.id?T.accent:T.t3,
            fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit',
            borderBottom:step===s.id?`2px solid ${T.accent}`:'2px solid transparent',
          }}>{s.label}</button>
        ))}
      </div>

      <div className="page-content" style={{paddingTop:16}}>

        {/* Step 0: Riepilogo */}
        {step===0&&(
          <>
            <GlassCard style={{background:'linear-gradient(135deg,rgba(0,200,150,0.12),rgba(0,200,150,0.04))',border:'1px solid var(--accent-glow)'}}>
              <div style={{fontSize:12,fontWeight:700,color:T.accent,letterSpacing:0.8,marginBottom:10}}>PESO</div>
              <MetricRow metrics={[
                {label:'Prec.',value:!isNaN(mp)?mp:null,unit:'kg',color:T.t3},
                {label:'Media S1',value:m1||null,unit:'kg',color:T.accent},
                {label:'Media S2',value:m2||null,unit:'kg',color:T.blue},
              ]}/>
              <MetricRow metrics={[
                {label:'Δ Prec→S1',value:m1&&!isNaN(mp)?`${(mp-m1).toFixed(2)}`:null,unit:'kg',color:m1&&!isNaN(mp)?(mp-m1)<0?T.coral:T.ok:T.t3},
                {label:'Δ S1→S2',value:m1&&m2?`${(m1-m2).toFixed(2)}`:null,unit:'kg',color:m1&&m2?(m1-m2)<0?T.coral:T.ok:T.t3},
                {label:'Giorni',value:`${cycle.days.filter(d=>d.peso).length}/${cycle.days.length}`,color:T.t1},
              ]}/>
            </GlassCard>

            {(cycle.mediaBagnoVolte||cycle.mediaFeciTipo)&&(
              <GlassCard>
                <div style={{fontSize:12,fontWeight:700,color:T.t3,letterSpacing:0.8,marginBottom:10}}>🚽 EVACUAZIONE</div>
                <MetricRow metrics={[
                  ...(cycle.mediaBagnoVolte?[{label:'Media volte',value:cycle.mediaBagnoVolte,unit:'×/g',color:T.blue}]:[]),
                  ...(cycle.mediaFeciTipo?[{label:'Media tipo',value:`${cycle.mediaFeciTipo}/7`,color:parseInt(cycle.mediaFeciTipo)>=3&&parseInt(cycle.mediaFeciTipo)<=5?T.ok:T.amber}]:[]),
                ]}/>
              </GlassCard>
            )}

            <GlassCard>
              <div style={{fontSize:12,fontWeight:700,color:T.t3,letterSpacing:0.8,marginBottom:10}}>🚶 PASSI MEDI</div>
              <MetricRow metrics={[
                {label:'Sett. 1',value:cycle.mediaPassiSett1?parseInt(cycle.mediaPassiSett1).toLocaleString('it-IT'):null,color:T.amber},
                {label:'Sett. 2',value:cycle.mediaPassiSett2?parseInt(cycle.mediaPassiSett2).toLocaleString('it-IT'):null,color:T.amber},
              ]}/>
            </GlassCard>

            <div style={{marginTop:8}}>
              <RFBtn onClick={()=>setStep(1)}>Vai al Feedback →</RFBtn>
            </div>
          </>
        )}

        {/* Step 1: Feedback */}
        {step===1&&(
          <>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
              <SectionLabel style={{margin:0}}>Feedback</SectionLabel>
              <span style={{fontSize:12,color:T.t3}}>{fbFilled}/{SEZIONI_FEEDBACK.length}</span>
            </div>
            {SEZIONI_FEEDBACK.map(s=>(
              <div key={s.key} style={{marginBottom:14}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
                  <span style={{fontSize:16}}>{s.icon}</span>
                  <div>
                    <div style={{fontSize:14,fontWeight:700,color:fb[s.key]?.trim()?T.t1:T.t2}}>{s.label}</div>
                    {s.sub&&<div style={{fontSize:11,color:T.t3}}>{s.sub}</div>}
                  </div>
                  {fb[s.key]?.trim()&&<span style={{marginLeft:'auto',color:T.accent,fontSize:14}}>✓</span>}
                </div>
                <RFTextarea value={fb[s.key]||''} onChange={v=>setFb(p=>({...p,[s.key]:v}))}
                  placeholder={`${s.label}…`} rows={3}/>
              </div>
            ))}

            <div style={{marginTop:8,display:'flex',gap:8}}>
              <RFBtn onClick={()=>setStep(2)} variant={fbDone?'primary':'secondary'}>
                {fbDone?'Vai al Report →':'Salta feedback →'}
              </RFBtn>
            </div>
          </>
        )}

        {/* Step 2: Export + prossima visita */}
        {step===2&&(
          <>
            <GlassCard>
              <div style={{fontSize:12,fontWeight:700,color:T.t3,letterSpacing:0.8,marginBottom:10}}>DATA PROSSIMA VISITA</div>
              <RFInput value={nuovaVisita} onChange={setNuovaVisita} placeholder="YYYY-MM-DD"/>
              {visitaOk&&<div style={{fontSize:12,color:T.accent,marginTop:6}}>✓ {fmtDateStr(nuovaVisita)}</div>}
            </GlassCard>

            {!exported ? (
              <>
                <ExportButton profile={profile} cycle={{...cycle,feedback:fb}} onConfirm={handleExported}
                  label="📊 Genera Report Excel e chiudi ciclo"/>
                <button onClick={handleExported} style={{width:'100%',marginTop:10,background:'none',border:'none',
                  color:T.t3,fontSize:13,fontWeight:600,cursor:'pointer',padding:'12px',fontFamily:'inherit'}}>
                  Chiudi senza generare report
                </button>
              </>
            ) : (
              <GlassCard style={{textAlign:'center',padding:'32px 20px',background:'var(--accent-dim)',border:'1px solid var(--accent-glow)'}}>
                <div style={{fontSize:52,marginBottom:12}}>✅</div>
                <div style={{fontSize:20,fontWeight:900,color:T.accent,marginBottom:6}}>Ciclo #{cycle.id+1} completato!</div>
                <div style={{fontSize:13,color:T.t2}}>Torna alla home per iniziare il prossimo ciclo.</div>
              </GlassCard>
            )}
          </>
        )}
      </div>
    </div>
  );
}

// ── TAB: Andamento (Grafici) ──────────────────────────────────────────────────
function TabAndamento({cycles}) {
  const RANGES = ['2S','1M','3M','1A'];
  const RLAB   = {'2S':'2 Sett.','1M':'1 Mese','3M':'3 Mesi','1A':'Anno'};
  const RDAYS  = {'2S':14,'1M':30,'3M':90,'1A':365};
  const [range, setRange] = useState('1M');
  const [offset, setOffset] = useState(0);

  const allPoints = [];
  cycles.forEach(c=>c.days.forEach(d=>{
    const p=parseFloat(d.peso);
    if(!isNaN(p)&&p>0){const dt=dateFromStr(d.data);if(dt)allPoints.push({date:dt,dateStr:d.data,peso:p,giorno:d.giorno,kcal:d.kcalGiorno?parseInt(d.kcalGiorno):null});}
  }));
  allPoints.sort((a,b)=>a.date-b.date);

  const now=new Date();now.setHours(23,59,59,999);
  const spanDays=RDAYS[range];
  const windowEnd=new Date(now.getTime()-offset*spanDays*24*60*60*1000);
  const windowStart=new Date(windowEnd.getTime()-spanDays*24*60*60*1000);
  const points=allPoints.filter(p=>p.date>=windowStart&&p.date<=windowEnd);
  const canGoBack=allPoints.some(p=>p.date<windowStart);
  const canGoFwd=offset>0;

  const periodLabel=offset===0
    ?(range==='2S'?'Ultime 2 settimane':range==='1M'?'Ultimo mese':range==='3M'?'Ultimi 3 mesi':'Ultimo anno')
    :`${fmtDate(windowStart)} – ${fmtDate(windowEnd)}`;

  function trendLine(pts){
    if(pts.length<3)return null;
    const n=pts.length,xs=pts.map((_,i)=>i),ys=pts.map(p=>p.peso);
    const mx=xs.reduce((a,b)=>a+b,0)/n,my=ys.reduce((a,b)=>a+b,0)/n;
    const num=xs.reduce((s,x,i)=>s+(x-mx)*(ys[i]-my),0),den=xs.reduce((s,x)=>s+(x-mx)**2,0);
    if(den===0)return null;
    const slope=num/den,intercept=my-slope*mx;
    return{y0:intercept,y1:intercept+slope*(n-1),slope};
  }
  const trend=trendLine(points);
  const W=340,H=200,PL=46,PR=16,PT=16,PB=36;
  const cW=W-PL-PR,cH=H-PT-PB;
  const pesos=points.map(p=>p.peso);
  const minP=pesos.length?Math.floor(Math.min(...pesos)-1):60;
  const maxP=pesos.length?Math.ceil(Math.max(...pesos)+1):100;
  const rangeP=maxP-minP||1;
  const toX=i=>PL+(i/Math.max(points.length-1,1))*cW;
  const toY=v=>PT+cH-((v-minP)/rangeP)*cH;
  let pathD='',areaD='',trendD='';
  if(points.length>0){
    const xs=points.map((_,i)=>toX(i)),ys=points.map(p=>toY(p.peso));
    pathD=`M ${xs[0]} ${ys[0]}`;
    for(let i=1;i<points.length;i++){const cpx=(xs[i-1]+xs[i])/2;pathD+=` C ${cpx} ${ys[i-1]}, ${cpx} ${ys[i]}, ${xs[i]} ${ys[i]}`;}
    areaD=pathD+` L ${xs[xs.length-1]} ${PT+cH} L ${xs[0]} ${PT+cH} Z`;
    if(trend)trendD=`M ${toX(0)} ${toY(trend.y0)} L ${toX(points.length-1)} ${toY(trend.y1)}`;
  }
  const last=points[points.length-1],first=points[0];
  const delta=last&&first&&points.length>1?(last.peso-first.peso).toFixed(1):null;
  const trendLabel=trend?(trend.slope<-0.05?'↓ Calante':trend.slope>0.05?'↑ Crescente':'→ Stabile'):null;
  const trendColor=trend?(trend.slope<-0.05?T.ok:trend.slope>0.05?T.coral:T.t3):T.t3;
  const yLabels=[minP,Math.round((minP+maxP)/2),maxP];

  // Passi
  const passiPoints=[];
  cycles.forEach(c=>{
    const start=dateFromStr(c.startDate);if(!start)return;
    const half=Math.ceil(c.days.length/2);
    const midDay=c.days[half-1];
    const midDate=midDay?dateFromStr(midDay.data):new Date(start.getTime()+7*24*60*60*1000);
    if(c.mediaPassiSett1&&parseInt(c.mediaPassiSett1)>0)passiPoints.push({date:start,dateStr:c.startDate,val:parseInt(c.mediaPassiSett1),label:'S1',cycleId:c.id});
    if(c.mediaPassiSett2&&parseInt(c.mediaPassiSett2)>0&&midDate)passiPoints.push({date:midDate,dateStr:midDay?.data||c.startDate,val:parseInt(c.mediaPassiSett2),label:'S2',cycleId:c.id});
  });
  const pp=passiPoints.filter(p=>p.date>=windowStart&&p.date<=windowEnd);

  // Kcal
  const kcalPoints=allPoints.filter(p=>p.kcal&&p.date>=windowStart&&p.date<=windowEnd&&p.kcal>0);

  return (
    <div style={{paddingBottom:'calc(var(--tab-h) + var(--safe-bottom) + 24px)'}}>
      {/* Header */}
      <div style={{background:'var(--bg)',padding:`calc(var(--safe-top) + 16px) 16px 16px`,borderBottom:'1px solid var(--border)'}}>
        <div style={{fontSize:26,fontWeight:900,color:T.t1,letterSpacing:-0.8,marginBottom:14}}>Andamento</div>

        {/* Range selector */}
        <div className="seg-control" style={{marginBottom:10}}>
          {RANGES.map(r=>(
            <button key={r} className={`seg-item${range===r?' active':''}`}
              onClick={()=>{setRange(r);setOffset(0);}}>
              {RLAB[r]}
            </button>
          ))}
        </div>

        {/* Nav */}
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <button onClick={()=>canGoBack&&setOffset(o=>o+1)} style={{
            width:36,height:36,borderRadius:10,border:`1px solid ${canGoBack?'var(--border2)':'var(--border)'}`,
            background:canGoBack?'var(--surface)':'transparent',color:canGoBack?T.t1:T.t4,
            fontSize:18,cursor:canGoBack?'pointer':'default',fontFamily:'inherit',
          }}>‹</button>
          <div style={{flex:1,textAlign:'center',fontSize:12,fontWeight:600,color:T.t3}}>{periodLabel}</div>
          <button onClick={()=>canGoFwd&&setOffset(o=>o-1)} style={{
            width:36,height:36,borderRadius:10,border:`1px solid ${canGoFwd?'var(--border2)':'var(--border)'}`,
            background:canGoFwd?'var(--surface)':'transparent',color:canGoFwd?T.t1:T.t4,
            fontSize:18,cursor:canGoFwd?'pointer':'default',fontFamily:'inherit',
          }}>›</button>
        </div>
      </div>

      <div style={{padding:'16px 16px 0'}}>
        {/* Hero stats */}
        {last&&(
          <GlassCard style={{background:'linear-gradient(135deg,rgba(0,200,150,0.1),rgba(0,200,150,0.03))'}}>
            <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between'}}>
              <div>
                <div style={{fontSize:11,color:T.t3,fontWeight:700,letterSpacing:0.8}}>PESO ATTUALE</div>
                <div style={{fontSize:48,fontWeight:900,color:T.accent,letterSpacing:-2,lineHeight:1.1}}>{last.peso}</div>
                <div style={{fontSize:14,color:T.t3}}>kg</div>
              </div>
              <div style={{textAlign:'right'}}>
                {delta!==null&&<div style={{fontSize:22,fontWeight:800,color:parseFloat(delta)<0?T.ok:T.coral}}>{parseFloat(delta)>0?'+':''}{delta} kg</div>}
                {trendLabel&&<div style={{fontSize:12,fontWeight:700,color:trendColor,marginTop:4}}>{trendLabel}</div>}
                <div style={{fontSize:11,color:T.t3,marginTop:4}}>{last.dateStr}</div>
              </div>
            </div>
          </GlassCard>
        )}

        {/* Peso chart */}
        <GlassCard style={{padding:'14px 10px'}}>
          <div style={{fontSize:13,fontWeight:800,color:T.t1,marginBottom:10,paddingLeft:4}}>⚖️ Peso</div>
          {points.length<2?(
            <div style={{textAlign:'center',padding:'24px',color:T.t3,fontSize:13}}>Nessuna misurazione in questo periodo</div>
          ):(
            <>
              <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{overflow:'visible'}}>
                <defs>
                  <linearGradient id="wGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor="var(--accent)" stopOpacity="0.25"/>
                    <stop offset="100%" stopColor="var(--accent)" stopOpacity="0.02"/>
                  </linearGradient>
                </defs>
                {yLabels.map((v,i)=>(
                  <g key={i}>
                    <line x1={PL} y1={toY(v)} x2={W-PR} y2={toY(v)} stroke="var(--border)" strokeWidth="1" strokeDasharray="3,4"/>
                    <text x={PL-6} y={toY(v)+4} textAnchor="end" fontSize="9" fill="var(--t3)">{v}</text>
                  </g>
                ))}
                {areaD&&<path d={areaD} fill="url(#wGrad)"/>}
                {trendD&&<path d={trendD} fill="none" stroke="var(--amber)" strokeWidth="1.5" strokeDasharray="5,3" opacity="0.7"/>}
                {pathD&&<path d={pathD} fill="none" stroke="var(--accent)" strokeWidth="2.5" strokeLinecap="round"/>}
                {points.map((p,i)=>{
                  const x=toX(i),y=toY(p.peso);
                  const showLbl=points.length<=8||i===0||i===points.length-1||i%Math.ceil(points.length/6)===0;
                  const gc=p.giorno==='ok'?T.ok:p.giorno==='cheat'?T.cheat:T.free;
                  return <g key={i}>
                    <circle cx={x} cy={y} r="5" fill="var(--bg2)" stroke="var(--accent)" strokeWidth="2"/>
                    <circle cx={x} cy={y} r="2.5" fill={gc}/>
                    {showLbl&&<text x={x} y={H-2} textAnchor="middle" fontSize="8" fill="var(--t3)">{p.dateStr.slice(5)}</text>}
                  </g>;
                })}
              </svg>
              {pesos.length>=2&&(
                <MetricRow metrics={[
                  {label:'Min',value:Math.min(...pesos),unit:'kg',color:T.ok},
                  {label:'Media',value:parseFloat((pesos.reduce((a,b)=>a+b,0)/pesos.length).toFixed(1)),unit:'kg',color:T.accent},
                  {label:'Max',value:Math.max(...pesos),unit:'kg',color:T.coral},
                ]}/>
              )}
            </>
          )}
        </GlassCard>

        {/* Kcal chart */}
        {kcalPoints.length>0&&(()=>{
          const tMin=windowStart.getTime(),tMax=windowEnd.getTime(),tRng=tMax-tMin||1;
          const toXt=d=>PL+((d.getTime()-tMin)/tRng)*cW;
          const KH=90,KPT=10,KPB=20,cHk=KH-KPT-KPB;
          const kVals=kcalPoints.map(p=>p.kcal);
          const minK=Math.max(0,Math.floor(Math.min(...kVals)/100)*100-200);
          const maxK=Math.ceil(Math.max(...kVals)/100)*100+200;
          const rngK=maxK-minK||500;
          const toYk=v=>KPT+cHk-((v-minK)/rngK)*cHk;
          const avgK=Math.round(kVals.reduce((a,b)=>a+b,0)/kVals.length);
          const barW=Math.max(4,Math.min(16,cW/Math.max(kcalPoints.length*2,1)));
          return (
            <GlassCard style={{padding:'14px 10px'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10,paddingLeft:4}}>
                <div style={{fontSize:13,fontWeight:800,color:T.t1}}>🔥 Calorie giornaliere</div>
                <div style={{fontSize:12,fontWeight:700,color:T.amber}}>media {avgK} kcal</div>
              </div>
              <svg width="100%" viewBox={`0 0 ${W} ${KH}`} style={{overflow:'visible'}}>
                <defs>
                  <linearGradient id="kGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor="var(--amber)" stopOpacity="0.9"/>
                    <stop offset="100%" stopColor="var(--amber)" stopOpacity="0.4"/>
                  </linearGradient>
                </defs>
                {[minK,avgK,maxK].map((v,i)=>(
                  <g key={i}>
                    <line x1={PL} y1={toYk(v)} x2={W-PR} y2={toYk(v)} stroke={i===1?'var(--amber)':'var(--border)'} strokeWidth="1" strokeDasharray={i===1?"4,3":"2,4"} opacity={i===1?0.5:1}/>
                    <text x={PL-4} y={toYk(v)+3} textAnchor="end" fontSize="7" fill="var(--t3)">{v>=1000?(v/1000).toFixed(1)+'k':v}</text>
                  </g>
                ))}
                {kcalPoints.map((p,i)=>{
                  const x=toXt(p.date),y=toYk(p.kcal);
                  const barH=Math.max(2,(KPT+cHk)-y);
                  const gc=p.giorno==='ok'?T.ok:p.giorno==='cheat'?T.cheat:T.free;
                  return <g key={i}>
                    <rect x={x-barW/2} y={y} width={barW} height={barH} rx="2" fill="url(#kGrad)" opacity="0.85"/>
                    <circle cx={x} cy={KPT+cHk+4} r="3" fill={gc}/>
                    {kcalPoints.length<=10&&<text x={x} y={y-4} textAnchor="middle" fontSize="7" fill="var(--amber)" fontWeight="700">{p.kcal}</text>}
                    <text x={x} y={KH} textAnchor="middle" fontSize="6.5" fill="var(--t3)">{p.dateStr.slice(5)}</text>
                  </g>;
                })}
              </svg>
              <MetricRow metrics={[
                {label:'Min',value:Math.min(...kVals),unit:'kcal',color:T.ok},
                {label:'Media',value:avgK,unit:'kcal',color:T.amber},
                {label:'Max',value:Math.max(...kVals),unit:'kcal',color:T.coral},
              ]}/>
            </GlassCard>
          );
        })()}

        {/* Passi chart */}
        {pp.length>0&&(()=>{
          const tMin=windowStart.getTime(),tMax=windowEnd.getTime(),tRng=tMax-tMin||1;
          const toXt=d=>PL+((d.getTime()-tMin)/tRng)*cW;
          const PH=80,PPT=8,PPB=18,cH2=PH-PPT-PPB;
          const maxP2=Math.max(...pp.map(p=>p.val)),minP2=Math.min(...pp.map(p=>p.val));
          const rng=maxP2-minP2||1000;
          const toYp=v=>PPT+cH2-((v-minP2)/rng)*cH2;
          return (
            <GlassCard style={{padding:'14px 10px'}}>
              <div style={{fontSize:13,fontWeight:800,color:T.t1,marginBottom:10,paddingLeft:4}}>🚶 Passi medi</div>
              <svg width="100%" viewBox={`0 0 ${W} ${PH}`} style={{overflow:'visible'}}>
                {[minP2,Math.round((minP2+maxP2)/2),maxP2].map((v,i)=>(
                  <g key={i}>
                    <line x1={PL} y1={toYp(v)} x2={W-PR} y2={toYp(v)} stroke="var(--border)" strokeWidth="1" strokeDasharray="2,4"/>
                    <text x={PL-4} y={toYp(v)+3} textAnchor="end" fontSize="7" fill="var(--t3)">{v>=1000?(v/1000).toFixed(0)+'k':v}</text>
                  </g>
                ))}
                {cycles.filter(c=>c.mediaPassiSett1&&c.mediaPassiSett2).map(c=>{
                  const p1=pp.find(p=>p.cycleId===c.id&&p.label==='S1'),p2=pp.find(p=>p.cycleId===c.id&&p.label==='S2');
                  if(!p1||!p2)return null;
                  return <line key={c.id} x1={toXt(p1.date)} y1={toYp(p1.val)} x2={toXt(p2.date)} y2={toYp(p2.val)} stroke="var(--t4)" strokeWidth="1.5" strokeDasharray="3,2"/>;
                })}
                {pp.map((p,i)=>{
                  const x=toXt(p.date),y=toYp(p.val),col=p.label==='S1'?T.amber:'#8D6E63';
                  return <g key={i}>
                    <circle cx={x} cy={y} r="5" fill="var(--bg2)" stroke={col} strokeWidth="2"/>
                    <circle cx={x} cy={y} r="2.5" fill={col}/>
                    <text x={x} y={PH-2} textAnchor="middle" fontSize="6.5" fill="var(--t3)">{p.dateStr.slice(5)}</text>
                    <text x={x} y={y-7} textAnchor="middle" fontSize="7.5" fill={col} fontWeight="700">{p.val>=1000?(p.val/1000).toFixed(1)+'k':p.val}</text>
                  </g>;
                })}
              </svg>
            </GlassCard>
          );
        })()}
      </div>
    </div>
  );
}


// ── TAB: Dieta ────────────────────────────────────────────────────────────────
function TabDieta({cycles, onSaveKcal}) {
  const [diet, setDietState] = useState(()=>loadDiet());
  useEffect(()=>{
    if(!loadDiet()){
      fetch('dieta.json').then(r=>r.ok?r.json():null).then(data=>{
        if(data&&Array.isArray(data)){const d={dayTypes:data,uploadedAt:new Date().toISOString(),source:'static'};saveDiet(d);setDietState(d);}
      }).catch(()=>{});
    }
  },[]);
  const [uploading,setUploading]=useState(false);
  const [uploadError,setUploadError]=useState('');
  const [selectedDayType,setSelectedDayType]=useState(null);
  const [mealSelections,setMealSelections]=useState({});
  const fileRef=useRef();

  const handleFileUpload=async(e)=>{
    const file=e.target.files[0];if(!file)return;
    setUploading(true);setUploadError('');
    if(file.name.endsWith('.json')){
      try{
        const text=await file.text();const parsed=JSON.parse(text);
        const data=Array.isArray(parsed)?parsed:parsed.dayTypes||Object.values(parsed);
        if(!data||!data.length)throw new Error('JSON vuoto o formato non riconosciuto');
        const d={dayTypes:data,uploadedAt:new Date().toISOString(),source:'json'};
        saveDiet(d);setDietState(d);setSelectedDayType(null);setMealSelections({});
      }catch(err){setUploadError('Errore JSON: '+err.message);}
      setUploading(false);e.target.value='';return;
    }
    setUploadError('Carica il file dieta.json');setUploading(false);e.target.value='';
  };

  const getSelIdx=(mi,gi)=>{const v=(mealSelections[mi]||{})[gi];if(v==null)return null;return typeof v==='object'?v.sel??null:v;};
  const getGrams=(mi,gi)=>{const v=(mealSelections[mi]||{})[gi];return(v&&typeof v==='object')?v.grams||'':'';};

  const selectMealOption=(mi,gi,optIdx)=>setMealSelections(prev=>({...prev,[mi]:{...(prev[mi]||{}),[gi]:{sel:optIdx,grams:(prev[mi]||{})[gi]?.grams||''}}}));
  const setMealGrams=(mi,gi,grams)=>setMealSelections(prev=>({...prev,[mi]:{...(prev[mi]||{}),[gi]:{sel:((prev[mi]||{})[gi]?.sel??((prev[mi]||{})[gi])),grams}}}));

  const selectedDay=diet?.dayTypes?.find(d=>d.id===selectedDayType);
  const dayTotals=(()=>{
    if(!selectedDayType||!diet)return{kcal:0,p:0,c:0,g:0};
    const day=diet.dayTypes.find(d=>d.id===selectedDayType);if(!day)return{kcal:0,p:0,c:0,g:0};
    let totalKcal=0,totalP=0,totalC=0,totalG=0;
    (day.meals||[]).forEach((meal,mi)=>{
      (meal.groups||[]).forEach((group,gi)=>{
        const selIdx=getSelIdx(mi,gi);if(selIdx==null)return;
        const opt=group.options[selIdx];if(!opt)return;
        const parsed=parseMealOption(opt.label||opt);
        const customGrams=getGrams(mi,gi);
        const gramsVal=customGrams!==''?parseFloat(customGrams):parsed.grams;
        const n=gramsVal?calcKcal(parsed.food,gramsVal):null;
        if(n){totalKcal+=n.kcal;totalP+=n.p;totalC+=n.c;totalG+=n.g;}
      });
      if(meal.fixedKcal)totalKcal+=meal.fixedKcal;
    });
    return{kcal:Math.round(totalKcal),p:Math.round(totalP*10)/10,c:Math.round(totalC*10)/10,g:Math.round(totalG*10)/10};
  })();

  if(!diet){
    return (
      <div style={{paddingBottom:'calc(var(--tab-h) + var(--safe-bottom) + 24px)'}}>
        <div style={{padding:`calc(var(--safe-top) + 20px) 16px 20px`,borderBottom:'1px solid var(--border)'}}>
          <div style={{fontSize:26,fontWeight:900,color:T.t1,letterSpacing:-0.8}}>Dieta</div>
        </div>
        <div style={{padding:'24px 16px'}}>
          <GlassCard style={{textAlign:'center',padding:'40px 20px'}}>
            <div style={{fontSize:52,marginBottom:16}}>🥗</div>
            <div style={{fontSize:17,fontWeight:800,color:T.t1,marginBottom:8}}>Nessun piano caricato</div>
            <div style={{fontSize:14,color:T.t3,marginBottom:20}}>Carica il file dieta.json del tuo nutrizionista</div>
            <input ref={fileRef} type="file" accept=".json" onChange={handleFileUpload} style={{display:'none'}}/>
            <RFBtn onClick={()=>fileRef.current.click()} disabled={uploading}>
              {uploading?'⏳ Caricamento…':'+ Carica dieta.json'}
            </RFBtn>
            {uploadError&&<div style={{marginTop:12,fontSize:12,color:T.coral}}>{uploadError}</div>}
          </GlassCard>
        </div>
      </div>
    );
  }

  if(!selectedDayType){
    return (
      <div style={{paddingBottom:'calc(var(--tab-h) + var(--safe-bottom) + 24px)'}}>
        <div style={{padding:`calc(var(--safe-top) + 20px) 16px 20px`,borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div style={{fontSize:26,fontWeight:900,color:T.t1,letterSpacing:-0.8}}>Dieta</div>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <input ref={fileRef} type="file" accept=".json" onChange={handleFileUpload} style={{display:'none'}}/>
            <button onClick={()=>fileRef.current.click()} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:8,padding:'6px 12px',fontSize:12,fontWeight:700,color:T.accent,cursor:'pointer',fontFamily:'inherit'}}>
              {uploading?'⏳':'Aggiorna'}
            </button>
          </div>
        </div>
        <div style={{padding:'16px 16px 0'}}>
          <div style={{fontSize:11,color:T.t3,marginBottom:16}}>Piano del {new Date(diet.uploadedAt).toLocaleDateString('it-IT')}</div>
          <SectionLabel>Tipo di giornata</SectionLabel>
          {(diet.dayTypes||[]).map(dt=>(
            <GlassCard key={dt.id} onClick={()=>{setSelectedDayType(dt.id);setMealSelections({});}} style={{cursor:'pointer',display:'flex',justifyContent:'space-between',alignItems:'center',padding:'16px 18px'}}>
              <div>
                <div style={{fontSize:16,fontWeight:800,color:T.t1}}>{dt.label||dt.id}</div>
                <div style={{fontSize:12,color:T.t3,marginTop:2}}>{(dt.meals||[]).length} pasti</div>
              </div>
              <span style={{color:T.t3,fontSize:22}}>›</span>
            </GlassCard>
          ))}
        </div>
      </div>
    );
  }

  // Day view
  const today2=todayStr();
  const curCycle=cycles&&cycles.length>0?cycles[cycles.length-1]:null;
  const todayInCycle=curCycle&&!curCycle.exported&&curCycle.days.some(d=>d.data===today2);
  const alreadySaved=curCycle?.days.find(d=>d.data===today2)?.kcalGiorno;

  return (
    <div style={{paddingBottom:'calc(var(--tab-h) + var(--safe-bottom) + 24px)'}}>
      {/* Sticky kcal bar */}
      <div style={{
        position:'sticky',top:0,zIndex:50,
        background:'rgba(10,10,15,0.92)',backdropFilter:'blur(20px)',WebkitBackdropFilter:'blur(20px)',
        borderBottom:'1px solid var(--border)',
        padding:'10px 16px',
      }}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <button onClick={()=>setSelectedDayType(null)} style={{background:'none',border:'none',color:T.accent,fontSize:14,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>‹ Indietro</button>
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:22,fontWeight:900,color:dayTotals.kcal>0?T.accent:T.t4,letterSpacing:-0.5}}>{dayTotals.kcal} kcal</div>
            {dayTotals.kcal>0&&<div style={{fontSize:10,color:T.t3}}>P{dayTotals.p} · C{dayTotals.c} · G{dayTotals.g}g</div>}
          </div>
          {dayTotals.kcal>0&&todayInCycle&&onSaveKcal?(
            <button onClick={()=>onSaveKcal(today2,dayTotals.kcal)} style={{
              background:alreadySaved?'var(--surface)':'var(--accent)',color:alreadySaved?T.accent:'#000',
              border:alreadySaved?'1px solid var(--accent-glow)':'none',
              borderRadius:10,padding:'8px 12px',fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit',
            }}>
              {alreadySaved?'Aggiorna':'Salva'}
            </button>
          ):<div style={{width:60}}/>}
        </div>
      </div>

      <div style={{padding:'12px 16px 0'}}>
        {(selectedDay?.meals||[]).map((meal,mi)=>(
          <div key={mi} style={{marginBottom:20}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
              <div style={{width:3,height:20,borderRadius:2,background:T.accent,flexShrink:0}}/>
              <div style={{fontSize:15,fontWeight:900,color:T.t1}}>{meal.label||meal.id}</div>
            </div>
            <GlassCard style={{padding:'14px 14px'}}>
              {(meal.groups||[]).map((group,gi)=>(
                <MealOptionSelector key={gi} meal={group}
                  selectedIdx={getSelIdx(mi,gi)} grams={getGrams(mi,gi)}
                  onSelect={idx=>selectMealOption(mi,gi,idx)}
                  onGramsChange={g=>setMealGrams(mi,gi,g)}/>
              ))}
            </GlassCard>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── TAB: Profilo ──────────────────────────────────────────────────────────────

  const completedCycles=cycles.filter(c=>c.completed||c.exported);

      <div style={{padding:'16px 16px 0'}}>

              {label:'Altezza (cm)',val:altezza,set:setAltezza,type:'number'},

                  <div style={{fontSize:13,color:T.t3,marginTop:2}}>{age?`${age} anni · `:''}{profile.altezza?`${profile.altezza} cm`:''}</div>

                <div style={{background:'var(--accent-dim)',borderRadius:10,padding:'10px 12px',border:'1px solid var(--accent-glow)'}}>
                  <div style={{fontSize:11,color:T.accent,fontWeight:700,marginBottom:2}}>PROSSIMA VISITA</div>

              const m2=c.mediaS2?parseFloat(c.mediaS2):avg(c.days.slice(Math.ceil(c.days.length/2)));
              const mp=parseFloat(c.mediaPesoPrec);

                className="rf-btn rf-btn-secondary" style={{flex:1,fontSize:14}}>
                💾 Backup JSON
              </button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

  const mp=parseFloat(cycle.mediaPesoPrec);

  return (
    <div className="screen" style={{background:'var(--bg)'}}>
      <NavBar title={`Ciclo #${cycle.id+1}`} onBack={onBack}/>
      <div className="page-content" style={{paddingTop:16}}>

          <SectionLabel>Peso</SectionLabel>

            {label:'Prec.',value:!isNaN(mp)?mp:null,unit:'kg',color:T.t3},

            {label:'Δ S1→S2',value:m1&&m2?`${(m1-m2).toFixed(2)}`:null,unit:'kg',color:m1&&m2?(m1-m2)<0?T.coral:T.ok:T.t3},
            {label:'Giorni',value:`${cycle.days.filter(d=>d.peso).length}/${cycle.days.length}`,color:T.t1},

                  </div>
                </div>
