              </div>
            ))}
          </div>
        ))}

        {SEZIONI_FEEDBACK.some(s=>cycle.feedback?.[s.key])&&(
          <>
            <SectionLabel style={{marginTop:8}}>Feedback</SectionLabel>
            {SEZIONI_FEEDBACK.map(s=>cycle.feedback?.[s.key]?(
              <GlassCard key={s.key} style={{padding:'12px 14px'}}>
                <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:6}}>
                  <span style={{fontSize:14}}>{s.icon}</span>
                  <div style={{fontSize:11,fontWeight:700,color:T.t3,textTransform:'uppercase',letterSpacing:0.6}}>{s.label}</div>
                </div>
                <div style={{fontSize:13,color:T.t2,lineHeight:1.6}}>{cycle.feedback[s.key]}</div>
              </GlassCard>
            ):null)}
          </>
        )}

        {profile&&(
          <div style={{marginTop:8}}>
            <ExportButton profile={profile} cycle={cycle} onConfirm={onConfirm}
              label={cycle.completed?'📊 Riesporta Report Excel':'📊 Genera Report Excel'}/>
          </div>
        )}
      </div>
    </div>
  );
}


// ── App root ──────────────────────────────────────────────────────────────────
function App() {
  const saved = loadState();
  const [profile, setProfile]     = useState(saved?.profile??null);
  const [cycles, setCycles]       = useState(saved?.cycles??[]);
  const [screen, setScreen]       = useState('home');  // 'home','dag','dieta','profilo' + modal screens
  const [tab, setTab]             = useState('oggi');   // 'oggi','andamento','dieta','profilo'
  const [activeDayIdx, setActiveDayIdx] = useState(0);
  const [viewingCycleId, setViewingCycleId] = useState(null);
  const [toast, setToast]         = useState(null);

  // Persist
  useEffect(()=>{ saveState({profile,cycles}); },[profile,cycles]);

  const showToast = (msg, icon) => {
    setToast({msg, icon});
    setTimeout(()=>setToast(null), 2800);
  };

  const currentCycle = cycles.length>0 ? cycles[cycles.length-1] : null;
  const closedCycle  = cycles.slice().reverse().find(c=>c.exported&&!c.completed)||null;

  // ── Handlers ─────────────────────────────────────────────────────────────────
  const handleSetup = p => {
    const finalProfile = {...p};
    if(!finalProfile.mediaPesoPrecIniziale) delete finalProfile.mediaPesoPrecIniziale;
    setProfile(finalProfile);
    if(cycles.length===0){
      const startDate = p.visitaNutrizionista ? getCycleStart(p.visitaNutrizionista) : new Date();
      setCycles([makeNewCycle(startDate, p.mediaPesoPrecIniziale||'', 0)]);
    }
  };

  const handleExcelImport = (prof, cycs) => {
    setProfile(p=>({...p,...prof}));
    setCycles(cycs);
    setScreen('main');
  };

  const handleDeleteCycle = id => {
    setCycles(p=>{ const f=p.filter(c=>c.id!==id); return f.map((c,i)=>({...c,id:i})); });
  };

  const handleNewCycle = () => {
    const hasPending = cycles.some(c=>c.exported&&!c.completed);
    if(hasPending)return;
    const lastRef = cycles.slice().reverse().find(c=>c.exported||c.completed);
    let mediaPesoPrec = profile?.mediaPesoPrecIniziale||'';
    if(lastRef&&lastRef.days&&lastRef.days.length>0){
      const lDays=lastRef.days, lHalf=Math.ceil(lDays.length/2);
      const s2avg=avg(lDays.slice(lHalf).filter(d=>d.peso));
      const val=s2avg??(lastRef.mediaS2?parseFloat(lastRef.mediaS2):null)??avg(lDays.filter(d=>d.peso))??'';
      mediaPesoPrec=val!==''?String(val):'';
    }
    let startDate=new Date();
    if(lastRef&&lastRef.days&&lastRef.days.length>0){
      const lastDay=lastRef.days[lastRef.days.length-1];
      if(lastDay){const d=dateFromStr(lastDay.data);if(d){startDate=new Date(d);startDate.setDate(d.getDate()+1);}}
    } else if(profile?.visitaNutrizionista){
      startDate=getCycleStart(profile.visitaNutrizionista);
    }
    setCycles(p=>[...p,makeNewCycle(startDate,mediaPesoPrec,p.length)]);
  };

  const handleChiudiCiclo = () => {
    setCycles(prev=>prev.map((c,i)=>{
      if(i!==prev.length-1)return c;
      const half=Math.ceil(c.days.length/2), hasTwoWeeks=c.days.length>=7;
      const m1=avg(c.days.slice(0,half).filter(d=>d.peso));
      const m2=hasTwoWeeks?avg(c.days.slice(half).filter(d=>d.peso)):null;
      const bagnoVals=c.days.map(d=>parseInt(d.bagnoVolte)).filter(v=>!isNaN(v)&&v>=0);
      const feciVals=c.days.map(d=>parseInt(d.feciTipo)).filter(v=>!isNaN(v)&&v>=1&&v<=7);
      return {
        ...c, exported:true, completed:false,
        mediaS1:m1?String(m1):'', mediaS2:m2?String(m2):'',
        mediaBagnoVolte:bagnoVals.length?String(Math.floor(bagnoVals.reduce((a,b)=>a+b,0)/bagnoVals.length)):'',
        mediaFeciTipo:feciVals.length?String(Math.floor(feciVals.reduce((a,b)=>a+b,0)/feciVals.length)):'',
      };
    }));
  };

  const handleSavePassi = (s1, s2) => {
    setCycles(p=>p.map((c,i)=>i===p.length-1?{...c,mediaPassiSett1:s1,mediaPassiSett2:s2}:c));
    showToast('Passi salvati', '🚶');
  };

  const handleSaveKcal = (dateStr, kcal) => {
    setCycles(p=>p.map((c,i)=>{
      if(i!==p.length-1)return c;
      return {...c,days:c.days.map(d=>d.data===dateStr?{...d,kcalGiorno:kcal}:d)};
    }));
    showToast(`${kcal} kcal salvate`, '🔥');
  };

  const handleOpenDay = idx => { setActiveDayIdx(idx); setScreen('day'); };

  const handleSaveDay = d => {
    setCycles(prev=>{
      const updated=prev.map((c,i)=>{
        if(i!==prev.length-1)return c;
        const newDays=c.days.map((dd,di)=>di===activeDayIdx?{...dd,...d}:dd);
        const updatedCycle={...c,days:newDays};
        const visita=profile?.visitaNutrizionista;
        const dayDate=c.days[activeDayIdx]?.data;
        if(visita&&dayDate){
          const visitaDate=dateFromStr(visita);
          const dayD=dateFromStr(dayDate);
          if(visitaDate&&dayD&&dayD.getTime()===visitaDate.getTime()){
            const trimmed=newDays.filter(dd=>{const dt=dateFromStr(dd.data);return dt&&dt<=visitaDate;});
            const mediaPesoPrecNext=avg(trimmed.filter(dd=>dd.peso))||'';
            const v=dateFromStr(visita);
            const newStart=new Date(v);newStart.setDate(v.getDate()+1);
            const half7=Math.ceil(trimmed.length/2),hasTwoWeeks=trimmed.length>=7;
            const m1x=avg(trimmed.slice(0,half7).filter(dd=>dd.peso));
            const m2x=hasTwoWeeks?avg(trimmed.slice(half7).filter(dd=>dd.peso)):null;
            const closedWithAvg={...updatedCycle,days:trimmed,exported:true,completed:false,
              mediaS1:m1x?String(m1x):'',mediaS2:m2x?String(m2x):'',
              mediaPesoPrec:mediaPesoPrecNext};
            const newCycle=makeNewCycle(newStart,mediaPesoPrecNext,prev.length);
            return [...prev.slice(0,-1),closedWithAvg,newCycle];
          }
        }
        return updatedCycle;
      });
      return Array.isArray(updated[0])?updated[0]:updated;
    });
    setScreen('main');
    showToast('Giornata salvata', '✓');
  };

  const handleSaveAndClose = (fb, nuovaVisita) => {
    setCycles(p=>{
      let found=false;
      return p.slice().reverse().map(c=>{
        if(!found&&c.exported&&!c.completed){found=true;return {...c,feedback:fb,completed:true};}
        return c;
      }).reverse();
    });
    if(nuovaVisita&&nuovaVisita.length===10&&dateFromStr(nuovaVisita)){
      setProfile(p=>({...p,visitaNutrizionista:nuovaVisita}));
    }
    setScreen('main');
    showToast('Ciclo completato!', '🎉');
    handleNewCycle();
  };

  const handleSaveProfilo = p => { setProfile(p); };

  // ── Routing ───────────────────────────────────────────────────────────────────
  if(!profile) return <ScreenSetup onDone={handleSetup} onImport={()=>setScreen('import')}/>;
  if(screen==='import') return <ScreenImportExcel onImport={handleExcelImport} onBack={()=>setScreen('main')}/>;
  if(screen==='day') return <ScreenDay cycle={currentCycle} dayIdx={activeDayIdx} onSave={handleSaveDay} onBack={()=>setScreen('main')}/>;

  if(screen==='chiusura'&&closedCycle) return (
    <ScreenChiusuraCiclo profile={profile} cycle={closedCycle}
      onSaveAndClose={handleSaveAndClose} onBack={()=>setScreen('main')}/>
  );

  if(screen==='previous'){
    const c=cycles.find(c=>c.id===viewingCycleId);
    if(c) return (
      <ScreenPrevious cycle={c} profile={profile}
        onConfirm={c.exported&&!c.completed?()=>handleSaveAndClose(c.feedback,''):null}
        onBack={()=>setScreen('main')}/>
    );
  }

  // ── Tab shell ─────────────────────────────────────────────────────────────────
  const TABS = [
    {id:'oggi',      icon:'🏠', label:'Oggi'},
    {id:'andamento', icon:'📈', label:'Andamento'},
    {id:'dieta',     icon:'🥗', label:'Dieta'},
    {id:'profilo',   icon:'👤', label:'Profilo'},
  ];

  const tabContent = () => {
    switch(tab) {
      case 'oggi': return (
        <TabOggi
          profile={profile} cycles={cycles}
          onOpenDay={handleOpenDay}
          onNewCycle={handleNewCycle}
          onDeleteCycle={handleDeleteCycle}
          onChiudiCiclo={handleChiudiCiclo}
          onSavePassi={handleSavePassi}
        />
      );
      case 'andamento': return <TabAndamento cycles={cycles}/>;
      case 'dieta': return <TabDieta cycles={cycles} onSaveKcal={handleSaveKcal}/>;
      case 'profilo': return (
        <TabProfilo
          profile={profile} cycles={cycles}
          onSave={handleSaveProfilo}
          onOpenImport={()=>setScreen('import')}
          onOpenPrevious={id=>{setViewingCycleId(id);setScreen('previous');}}
        />
      );
    }
  };

  return (
    <div style={{height:'100vh',overflow:'hidden',position:'relative',background:'var(--bg)'}}>
      {/* Chiusura ciclo CTA — floating banner */}
      {closedCycle&&tab==='oggi'&&(
        <div style={{
          position:'fixed',bottom:`calc(var(--tab-h) + var(--safe-bottom) + 12px)`,
          left:16,right:16,zIndex:150,
        }}>
          <button onClick={()=>setScreen('chiusura')} className="tappable" style={{
            width:'100%',padding:'16px 20px',borderRadius:18,
            background:'linear-gradient(135deg,rgba(255,159,10,0.9),rgba(255,120,0,0.9))',
            border:'none',color:'#000',fontSize:15,fontWeight:800,cursor:'pointer',
            fontFamily:'inherit',display:'flex',alignItems:'center',justifyContent:'space-between',
            backdropFilter:'blur(10px)',
          }}>
            <span>📝 Chiudi Ciclo #{(closedCycle.id||0)+1}</span>
            <span style={{fontSize:20}}>›</span>
          </button>
        </div>
      )}

      {/* Scrollable content */}
      <div style={{height:'100%',overflowY:'auto',WebkitOverflowScrolling:'touch'}}>
        {tabContent()}
      </div>

      {/* Tab bar */}
      <div className="tab-bar">
        {TABS.map(t=>(
          <div key={t.id} className={`tab-item${tab===t.id?' active':''}`} onClick={()=>setTab(t.id)}>
            <div className="tab-icon" style={{filter:tab===t.id?'none':'grayscale(80%)',opacity:tab===t.id?1:0.5}}>
              {t.icon}
            </div>
            <div className="tab-label" style={{color:tab===t.id?'var(--accent)':'var(--t3)'}}>
              {t.label}
            </div>
          </div>
        ))}
      </div>

      {/* Toast */}
      {toast&&<Toast message={toast.msg} icon={toast.icon}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);


</script>
</body>
</html>
